<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login - Assistant Professor Test Series</title>
<meta name="theme-color" content="#0B1F4D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-hd"><div class="in"><a class="brand" href="index.html"><i>AP</i>Assistant Professor Test Series</a></div></header>
<div class="auth-wrap"><div class="auth-card">
  <div class="auth-top"><h1 id="title">Welcome back</h1><p>Log in to take tests and see your results.</p></div>
  <div class="tabs2"><button id="tabLogin" class="on" type="button">Log in</button><button id="tabSignup" type="button">Create account</button></div>
  <div style="padding:14px 22px 0"><div id="msg" class="msg err" hidden></div></div>

  <form id="fLogin" class="form" novalidate>
    <div class="fld"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="email" inputmode="email" required></div>
    <div class="fld"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-navy btn-block" type="submit">Log in</button>
    <button class="linkbtn" id="forgot" type="button">Forgot password?</button>
    <div class="or">or</div>
    <button class="gbtn" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg> Continue with Google</button>
  </form>

  <form id="fSignup" class="form" novalidate hidden>
    <div class="fld"><label for="sName">Full name</label><input id="sName" type="text" autocomplete="name" required></div>
    <div class="fld"><label for="sEmail">Email</label><input id="sEmail" type="email" autocomplete="email" inputmode="email" required></div>
    <div class="fld"><label for="sPass">Password</label><input id="sPass" type="password" autocomplete="new-password" required><small>At least 6 characters.</small></div>
    <div class="fld"><label for="sPass2">Confirm password</label><input id="sPass2" type="password" autocomplete="new-password" required></div>
    <button class="btn btn-orange btn-block" type="submit">Create account</button>
    <div class="or">or</div>
    <button class="gbtn" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg> Sign up with Google</button>
    <small style="color:var(--muted)">After signing up, the admin needs to approve your account before you can take tests.</small>
  </form>
</div></div>
<script type="module" src="assets/js/login-page.js"></script>
</body></html>
