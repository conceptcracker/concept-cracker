<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My profile - Assistant Professor Test Series</title>
<meta name="theme-color" content="#0B1F4D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-hd"><div class="in"><a class="brand" href="index.html"><i>AP</i>Assistant Professor Test Series</a><div id="acct" class="acct"></div></div></header>
<div class="page">
  <h1>My profile</h1>
  <div id="status" class="status-card todo"></div>

  <div class="panel">
    <div id="firstNote" class="notice" hidden>Welcome! Please tell us a little about yourself to finish setting up your account.</div>
    <form id="pForm" class="form" novalidate>
      <div class="two">
        <div class="fld"><label for="pName">Full name <i>*</i></label><input id="pName" type="text" autocomplete="name" required></div>
        <div class="fld"><label for="pEmail">Email</label><input id="pEmail" type="email" readonly></div>
        <div class="fld"><label for="pPhone">Mobile number <i>*</i></label><input id="pPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="10-digit number" required></div>
        <div class="fld"><label for="pCity">City</label><input id="pCity" type="text" autocomplete="address-level2"></div>
        <div class="fld"><label for="pQual">Qualification</label>
          <select id="pQual"><option value="">Select</option><option>B.Sc</option><option>M.Sc</option><option>M.Phil</option><option>Ph.D</option><option>B.Ed</option><option>Other</option></select></div>
        <div class="fld"><label for="pTarget">Preparing for</label><input id="pTarget" type="text"></div>
      </div>
      <div id="pMsg" class="msg" hidden></div>
      <button class="btn btn-orange" id="pSave" type="submit">Save profile</button>
    </form>
  </div>

  <h2 class="sec-h" id="results">My results</h2>
  <div class="sum" id="resSum"></div>
  <div class="filters" id="resFilters" style="margin-top:14px"></div>
  <div class="rlist" id="resList"></div>

  <div style="margin-top:34px"><button class="btn btn-ghost" id="logout" type="button">Log out</button></div>
</div>
<script type="module" src="assets/js/profile-page.js"></script>
</body></html>
