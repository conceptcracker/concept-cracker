<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin - Assistant Professor Test Series</title>
<meta name="theme-color" content="#0B1F4D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-hd"><div class="in"><a class="brand" href="index.html"><i>AP</i>Assistant Professor Test Series</a><div id="acct" class="acct"></div></div></header>
<div class="page">
  <h1>Admin panel</h1>
  <div class="tabs3"><button id="tab_cand" class="on" type="button">Candidates</button><button id="tab_ques" type="button">Questions</button></div>

  <section id="paneCand">
    <div class="sum" id="cCount"></div>
    <div class="tools"><input id="cSearch" type="search" placeholder="Search name, email or phone"></div>
    <div class="filters" id="cFilters" style="margin-top:12px"></div>
    <div id="cList"><p class="none">Loading...</p></div>
  </section>

  <section id="paneQues" hidden>
    <div class="panel" id="upload">
      <h3 style="font-family:var(--f-head);margin-bottom:6px">Upload questions</h3>
      <p style="color:var(--muted);font-size:14.5px;margin-bottom:14px">Choose the test, then pick the questions file (or paste its content). Check it, then publish. Questions are stored privately and only approved candidates can open them.</p>
      <div class="form">
        <div class="fld"><label for="qSel">Test</label><select id="qSel"></select></div>
        <div class="fld"><label for="qFile">Questions file (.js)</label><input id="qFile" type="file" accept=".js,.txt,.json"></div>
        <div class="fld"><label for="qText">...or paste the content</label><textarea id="qText" placeholder="var qs = [ ... ];" spellcheck="false"></textarea></div>
        <div id="qReport"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-navy" id="qCheck" type="button">Check questions</button><button class="btn btn-orange" id="qPublish" type="button" disabled>Publish</button></div>
      </div>
    </div>
    <h2 class="sec-h">All tests</h2>
    <div id="qList"></div>
  </section>
</div>
<script type="module" src="assets/js/admin-page.js"></script>
</body></html>
